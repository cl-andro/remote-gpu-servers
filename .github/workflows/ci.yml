name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Syntax
        run: |
          python -m py_compile lib/*.py */kernel_config.py

      - name: Check Bash Syntax
        run: |
          bash -n bin/cluster lib/ctr.sh */ctr.sh

      - name: Validate Notebooks & Check Unsubstituted Placeholders
        run: |
          python -c "
          import glob, json, sys
          for nb in sorted(glob.glob('*/notebook.ipynb')):
              with open(nb) as f:
                  data = json.load(f)
              assert len(data.get('cells', [])) > 0, f'{nb} has no cells'
              print(f'OK: {nb}')
          "
          ! grep -rnE '__[A-Z0-9_]+__' */notebook.ipynb
